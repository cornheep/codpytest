<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodPy</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="style.css">
 <script src="script.js" defer></script>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-py">Cod</span><span class="logo-code">Py</span>
  </div>
  <div class="pyodide-status">
    <div class="status-dot" id="pyodide-dot"></div>
    <span id="pyodide-label">Loading Python...</span>
  </div>

  <!-- MODE SWITCH -->
  <div class="mode-switch" style="margin-left:18px">
    <button class="mode-btn active code" id="mode-code-btn" onclick="switchMode('code')">
      <span class="mode-icon">⌨️</span> Code Challenges
    </button>
    <button class="mode-btn machine" id="mode-machine-btn" onclick="switchMode('machine')">
      <span class="mode-icon">⚙️</span> Machine Activities
    </button>
  </div>

  <div class="header-right">
    <div class="score-pill">Score: <span id="total-score">0</span></div>
  </div>
</header>

<aside>
  <div class="sidebar-search">
    <input type="text" id="search-input" placeholder="Search challenges..." oninput="filterChallenges()">
  </div>
  <!-- Code challenges list -->
  <div class="challenge-list" id="challenge-list"></div>
  <!-- Machine activities list -->
  <div class="challenge-list hidden" id="machine-list"></div>
</aside>

<main>
  <div class="workspace">
    <!-- Code mode panels -->
    <div class="problem-panel" id="problem-panel"></div>
    <div class="editor-panel" id="editor-panel">
      <div class="editor-topbar">
        <div class="tab">
          <div class="tab-dot"></div>
          <span>solution.py</span>
        </div>
      </div>
      <div class="code-editor-wrapper">
        <textarea id="code-editor" spellcheck="false"></textarea>
      </div>
      <div class="output-panel">
        <div class="output-topbar">
          <span>Output</span>
          <span class="run-time" id="run-time"></span>
        </div>
        <div class="output-content" id="output-content">Run your code to see output here.</div>
      </div>
    </div>

    <!-- Machine mode panels -->
    <div class="machine-panel hidden" id="machine-panel"></div>
    <div class="machine-editor-panel hidden" id="machine-editor-panel">
      <div class="editor-topbar">
        <div class="tab" style="border-color:rgba(167,139,250,0.3);color:var(--purple)">
          <div class="tab-dot" style="background:var(--purple)"></div>
          <span>program.py</span>
        </div>
      </div>
      <div class="code-editor-wrapper">
        <textarea id="machine-code-editor" spellcheck="false"></textarea>
      </div>
      <div class="output-panel">
        <div class="output-topbar">
          <span>Output</span>
          <span class="run-time" id="machine-run-time"></span>
        </div>
        <div class="output-content" id="machine-output-content">Run your program to see output here.</div>
      </div>
    </div>
  </div>
  
  <div class="bottom-bar">
    <!-- Code bar -->
    <span id="code-bar-items" style="display:contents">
      <button class="btn btn-primary" id="run-btn" onclick="runCode()">▶ Run Code</button>
      <button class="btn btn-primary" onclick="checkCode()">✓ Check Code</button>
      <button class="btn btn-secondary" onclick="resetCode()">↻ Reset</button>
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
        <div class="progress-label" id="prog-label">0/0</div>
      </div>
      <div class="char-count" id="char-count">0 chars</div>
    </span>
    <!-- Machine bar -->
    <span id="machine-bar-items" style="display:none;width:100%;align-items:center;gap:10px">
      <button class="btn btn-primary" id="machine-run-btn" onclick="runMachineCode()" style="background:var(--purple);border-color:var(--purple)">▶ Run Program</button>
      <button class="btn btn-primary" onclick="checkMachineCode()" style="background:var(--purple);border-color:var(--purple)">✓ Check Program</button>
      <button class="btn btn-secondary" onclick="resetMachineActivity()">↻ Reset</button>
      <div class="progress-wrap">
        <div class="progress-bar" id="machine-progress-bar" style="background:linear-gradient(90deg,var(--purple),#7c3aed)"></div>
        <div class="progress-label" id="machine-prog-label">0/0</div>
      </div>
      <div class="char-count" id="machine-char-count">0 chars</div>
    </span>
  </div>
</main>

<!-- Results Overlay -->
<div class="overlay" id="results-overlay" onclick="closeResults(event)">
  <div class="results-card" onclick="event.stopPropagation()">
    <div class="result-header">
      <div class="result-icon" id="res-icon">
        <span id="res-icon-char">✓</span>
      </div>
      <div class="result-info">
        <div class="result-title" id="res-title">All Tests Passed!</div>
        <div class="result-sub" id="res-sub">Challenge Title</div>
      </div>
    </div>
    
    <div class="res-section">
      <div class="res-label">Test Results</div>
      <div class="test-list" id="test-list"></div>
    </div>
    
    <div class="res-section">
      <div class="res-label">AI Feedback</div>
      <div class="ai-box" id="ai-box">Great work!</div>
    </div>
    
    <div class="result-actions">
      <button class="btn btn-primary" onclick="closeResults()">Continue</button>
      <button class="btn btn-secondary" id="next-btn" onclick="nextChallenge()">Next Challenge →</button>
    </div>
  </div>
</div>

<!-- Loading Overlay -->
<div class="overlay" id="loading-overlay">
  <div class="loading-card">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">Checking your code...</div>
  </div>
</div>


</body>
</html>
